name: CI and CD — Private Link Network

on:
  pull_request:
    branches: [main]
    paths:
      - "Terraform/Azure/tfm-privateLink-network/**"
      - ".github/**"
  push:
    branches: [main]
    paths:
      - "Terraform/Azure/tfm-privateLink-network/**"
      - ".github/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only; never apply
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/terraform-checks.yml
    with:
      stack: PRIVATELINK
  deploy:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.PRIVATELINK_DEPLOY_ENABLED == 'true'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      stack: PRIVATELINK
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
