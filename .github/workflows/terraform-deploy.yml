name: Terraform deployment

on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
      dry_run:
        description: Plan only; skip the apply job
        type: boolean
        default: false
      cyber_subscription:
        description: Allowlisted Cyber subscription for a manual Key Vault request
        type: string
        default: ""
      keyvault_request_json:
        description: Non-secret dispatch inputs; validated before Azure authentication
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: terraform-deployment-${{ inputs.stack }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_USE_CLI: "false"
  STACK: ${{ inputs.stack }}
  CYBER_SUBSCRIPTION: ${{ inputs.cyber_subscription }}
  KEYVAULT_REQUEST_JSON: ${{ inputs.keyvault_request_json }}
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  TF_ROOT: ${{ inputs.stack == 'KEYVAULT' && 'Terraform/Azure/deployments/keyvault' || 'Terraform/Azure/tfm-privateLink-network' }}

jobs:
  configuration:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan_environment: ${{ steps.configuration.outputs.plan_environment }}
      apply_environment: ${{ steps.configuration.outputs.apply_environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate request and choose trusted configuration
        id: configuration
        run: python3 .github/scripts/terraform-pipeline.py configure
  plan:
    needs: configuration
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: ${{ needs.configuration.outputs.plan_environment }}
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","linux","azure-terraform"]') }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      ARM_CLIENT_ID: ${{ vars.PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.SUBSCRIPTION_ID }}
      BACKEND_ACCOUNT: ${{ vars.BACKEND_ACCOUNT }}
      BACKEND_CONTAINER: ${{ vars.BACKEND_CONTAINER }}
      TFVARS_JSON: ${{ vars.TFVARS_JSON }}
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Verify approval protection exists
        uses: actions/github-script@v7
        env:
          APPLY_ENVIRONMENT: ${{ needs.configuration.outputs.apply_environment }}
        with:
          script: |
            const gate = require('./.github/scripts/approval-gate.cjs');
            await gate.verifyProtection({github, context}, process.env.APPLY_ENVIRONMENT);
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate deployment settings and materialize non-secret inputs
        run: python3 .github/scripts/terraform-pipeline.py prepare
      - name: Authenticate Azure preflight with plan OIDC identity
        if: inputs.cyber_subscription != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
      - name: Verify selected Cyber subscription and existing resource group
        if: inputs.cyber_subscription != ''
        run: python3 .github/scripts/terraform-pipeline.py azure-preflight
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: "Terraform check: fmt -check"
        run: terraform -chdir="$TF_ROOT" fmt -check -recursive -diff
      - name: "Terraform init: OIDC and Entra Blob backend"
        run: terraform -chdir="$TF_ROOT" init -input=false -reconfigure -lockfile=readonly -backend-config=.pipeline/backend.hcl
      - name: "Terraform validate: deployment configuration"
        run: terraform -chdir="$TF_ROOT" validate -no-color
      - name: "Terraform plan: save proposed changes for review"
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          code=0
          terraform -chdir="$TF_ROOT" plan -input=false -no-color -lock-timeout=5m \
            -var-file=.pipeline/inputs.tfvars.json \
            -detailed-exitcode -out=.pipeline/deployment.tfplan || code=$?
          case "$code" in
            0) printf 'changed=false\n' >> "$GITHUB_OUTPUT" ;;
            2) printf 'changed=true\n' >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
      - name: "Review: summarize plan without resource attribute values"
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_ROOT" show -json .pipeline/deployment.tfplan \
            | python3 .github/scripts/terraform-pipeline.py summarize
          python3 .github/scripts/terraform-pipeline.py manifest
      - name: Upload immutable same-run plan
        if: steps.plan.outputs.changed == 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.stack }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TF_ROOT }}/.pipeline/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  apply:
    needs: [configuration, plan]
    if: needs.plan.outputs.changed == 'true' && !inputs.dry_run
    environment:
      name: ${{ needs.configuration.outputs.apply_environment }}
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","linux","azure-terraform"]') }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.APPLY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.SUBSCRIPTION_ID }}
      EXPECTED_ARTIFACT_DIGEST: ${{ needs.plan.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Reject superseded commits after approval
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
            if (data.object.sha !== context.sha) {
              throw new Error('main has advanced. Review and approve a fresh plan for the latest commit.');
            }
      - name: Require an actual hvaandres approval for this environment
        uses: actions/github-script@v7
        env:
          APPLY_ENVIRONMENT: ${{ needs.configuration.outputs.apply_environment }}
        with:
          script: |
            const gate = require('./.github/scripts/approval-gate.cjs');
            await gate.verifyApproval({github, context}, process.env.APPLY_ENVIRONMENT);
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable artifact digest via GitHub
        id: artifact
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: plan-${{ inputs.stack }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.runId
            });
            const matches = artifacts.filter(item => item.name === process.env.ARTIFACT_NAME && !item.expired);
            if (matches.length !== 1 || matches[0].digest !== `sha256:${process.env.EXPECTED_ARTIFACT_DIGEST}`) {
              throw new Error('Missing artifact or digest differs from the planning job.');
            }
            core.setOutput('id', String(matches[0].id));
      - name: Download only this run and attempt's plan
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          path: ${{ env.TF_ROOT }}/.pipeline/
      - name: Verify artifact provenance and file integrity
        run: python3 .github/scripts/terraform-pipeline.py verify
      - name: Authenticate Azure preflight with apply OIDC identity
        if: inputs.cyber_subscription != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
      - name: Recheck Cyber subscription and resource group after approval
        if: inputs.cyber_subscription != ''
        run: python3 .github/scripts/terraform-pipeline.py azure-preflight
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: "Terraform init: same backend, approved apply identity"
        run: terraform -chdir="$TF_ROOT" init -input=false -reconfigure -lockfile=readonly -backend-config=.pipeline/backend.hcl
      - name: "Terraform apply: only the hvaandres-approved saved plan"
        run: terraform -chdir="$TF_ROOT" apply -input=false -no-color -lock-timeout=5m .pipeline/deployment.tfplan
